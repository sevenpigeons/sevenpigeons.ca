<li class="title-list">
    {% if entry.date %}
    <time class="content-meta">{{ entry.date | date(format="%Y-%m-%d") }}</time>
    {% endif %}
    <a href="{{ entry.link }}" target="_blank" class="content-link">
        {{ entry.name }}
    </a>
    {% if entry.note %}
    <br>» {{ entry.note}}
    {% endif %}
</li>
